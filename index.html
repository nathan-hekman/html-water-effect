<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:,">
<title>Ocean — WebGPU</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); max-width: calc(100% - 80px); font: 12px/1.45 ui-monospace, Consolas, monospace; color: #e8e2d6;
         text-shadow: 0 1px 2px #000a; pointer-events: none; user-select: none; }
  #hud .help { opacity: .7; }
  #panel { position: fixed; right: max(12px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 52px); width: min(300px, calc(100vw - 48px - env(safe-area-inset-left) - env(safe-area-inset-right))); max-height: calc(100dvh - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px; border-radius: 8px;
           background: #0b0f14c8; backdrop-filter: blur(6px); color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif; }
  #panel.hidden { display: none; }
  #panel label { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 110px) 36px; gap: 6px; align-items: center; margin: 3px 0; }
  #panel input { width: 100%; min-width: 0; min-height: 28px; accent-color: #e2a04e; }
  #panel select { grid-column: 2 / 4; min-height: 44px; color: #e5e1d8; background: #18202a; border: 1px solid #667; border-radius: 5px; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  button { color: #e8e2d6; background: #0b0f148c; border: 1px solid #e8e2d655; font: 12px system-ui; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #e2a04e; outline-offset: 3px; }
  #settings { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 8px; }
  #settings svg { width: 22px; height: 22px; vertical-align: middle; }
  #touch-controls { display: none; }
  .touch #touch-controls { display: block; }
  .panel-open #touch-controls { display: none; }
  .touch #panel input { min-height: 44px; }
  .touch #hud { font-size: 11px; }
  #stick { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: calc(20px + env(safe-area-inset-left)); width: 112px; height: 112px; padding: 0; border-radius: 50%; touch-action: none; user-select: none; }
  #stick span { position: absolute; width: 42px; height: 42px; left: 34px; top: 34px; border-radius: 50%; background: #e8e2d64d; pointer-events: none; }
  #stick::after { content: 'MOVE'; position: absolute; left: 0; right: 0; bottom: 12px; font-size: 9px; opacity: .7; pointer-events: none; }
  #height-controls { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: calc(20px + env(safe-area-inset-right)); display: grid; gap: 10px; }
  #height-controls button { width: 48px; height: 48px; border-radius: 50%; touch-action: none; user-select: none; }
  #height-controls svg { width: 22px; height: 22px; vertical-align: middle; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; padding: max(24px, env(safe-area-inset-top)) 24px; color: #f88; font: 16px/1.5 system-ui; white-space: pre-wrap; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="fps">starting…</div>
  <div class="help">click: mouse look · WASD move · Space/E up · Q/C down · Shift fast · wheel speed · H panel</div>
</div>
<button id="settings" type="button" aria-label="Settings" aria-controls="panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button>
<div id="panel" class="hidden"></div>
<div id="touch-controls">
  <button id="stick" type="button" aria-label="Drag to move"><span></span></button>
  <div id="height-controls">
    <button id="rise" type="button" aria-label="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
    <button id="sink" type="button" aria-label="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
  </div>
</div>
<div id="err" role="alert"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
